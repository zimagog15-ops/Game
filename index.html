<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roperok Simulator</title>
    <style>
        body {
            background: #19191a;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .screen {
            display: none;
        }
        .active {
            display: block;
        }
        button {
            background: #2d81e0;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        .stat-box {
            margin-top: 20px;
            font-size: 20px;
            border: 1px solid #444;
            padding: 10px;
            display: inline-block;
            min-width: 120px;
        }
    </style>
    <!-- Подключаем VK Bridge -->
    <script src="https://vk.com/js/api/vk_bridge.js"></script>
</head>
<body>

    <!-- ЭКРАН 1: АВТОРИЗАЦИЯ -->
    <div id="auth-screen" class="screen active">
        <h2>Roperok Sound</h2>
        <p>Симулятор</p>
        <button onclick="startAuth()">Авторизоваться</button>
    </div>

    <!-- ЭКРАН 2: ИГРА -->
    <div id="game-screen" class="screen">
        <h2>Добро пожаловать!</h2>
        <p>Привет, <span id="user-name">Игрок</span>!</p>

        <!-- Блок со счётчиком (сюда будет падать то, что ты захочешь считать) -->
        <div class="stat-box">
            Симуляция: <span id="sim-count">0</span>
        </div>

        <button onclick="handleTap()">Начать симуляцию</button>
    </div>

    <script>
        // Инициализируем приложение
        if (typeof vkBridge !== 'undefined') {
            vkBridge.send('VKWebAppInit');
        } else {
            console.error('Критическая ошибка: VK Bridge не подключился');
        }

        function startAuth() {
            if (typeof vkBridge !== 'undefined') {
                vkBridge.send('VKWebAppGetUserInfo')
                    .then((data) => {
                        if (data && data.id) {
                            const userName = data.first_name || 'Игрок';
                            document.getElementById('user-name').innerText = userName;

                            // Переключаем экраны
                            document.getElementById('auth-screen').classList.remove('active');
                            document.getElementById('game-screen').classList.add('active');
                        } else {
                            alert('Не удалось получить данные пользователя.');
                        }
                    })
                    .catch((error) => {
                        console.error('Ошибка авторизации ВК:', error);
                        alert('Вход отменён или произошёл сбой.');
                    });
            } else {
                alert('Ошибка: библиотека ВК не найдена. Перезагрузите страницу.');
            }
        }

        let simCount = 0; // Переменная, которая будет считать твою симуляцию

        function handleTap() {
            simCount++;
            document.getElementById('sim-count').innerText = simCount;

            // Сюда потом можно добавить любую логику: начисление очков, прогресс, таймеры и т.д.
            console.log('Симуляция шаг:', simCount);
        }
    </script>
</body>
</html>
